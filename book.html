<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a call — Veteran Strategic</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="index.html">Veteran Strategic</a>
    <div class="nav-links">
      <a href="how.html">How a day works</a>
      <a href="about.html">About</a>
      <a href="insights/index.html">Insights</a>
      <a class="btn" href="book.html">Book a call</a>
    </div>
  </nav>
  <main class="page">
    <p class="kicker">Book</p>
    <h1>Tell us about the meeting.</h1>
    <p>Replace this form with your Calendly link when it is live. Three questions are enough.</p>
    <form action="mailto:hello@veteranstrategic.com" method="post" enctype="text/plain">
      <label>Name<input name="name" required /></label>
      <label>Work email<input type="email" name="email" required /></label>
      <label>Company<input name="company" required /></label>
      <label>Meeting type<select name="type"><option>Quarterly planning</option><option>Offsite</option><option>Summit or leadership day</option><option>Not sure yet</option></select></label>
      <label>When is the meeting, if you have a date?<input name="date" /></label>
      <button class="btn" type="submit">Request a time</button>
    </form>
  </main>
  <footer><span>Veteran Strategic</span><a href="index.html">Home</a></footer>
</body>
</html>
